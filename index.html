<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golem — Legal &amp; Support</title>
  <style>
    :root { --bg: #101015; --card: #202027; --border: #34333d; --text: #f6f4fa; --muted: #a6a3af; --accent: #c99df3; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    main { max-width: 680px; margin: 0 auto; padding: 56px 20px; }
    h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.4px; }
    p { color: var(--muted); margin: 0 0 28px; }
    .list { display: flex; flex-direction: column; gap: 12px; }
    a.card { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; color: var(--text); text-decoration: none; font-weight: 600; }
    a.card:hover { border-color: var(--accent); }
    a.card span { color: var(--accent); font-size: 14px; }
    footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Golem</h1>
    <p>Legal policies, account deletion, and support resources for the Golem AI mobile app.</p>
    <div class="list">
      <a class="card" href="./privacy.html">Privacy Policy <span>→</span></a>
      <a class="card" href="./terms.html">Terms &amp; Conditions <span>→</span></a>
      <a class="card" href="./delete-account.html">Account &amp; Data Deletion <span>→</span></a>
    </div>
    <footer>
      Support: <a href="mailto:mail.imotion.ai@gmail.com">mail.imotion.ai@gmail.com</a>
    </footer>
  </main>
</body>
</html>
